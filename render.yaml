# Apply this Blueprint only after reviewing the plan and adding the secret values.
# Automatic deploys are disabled so production updates remain deliberate.
services:
  - type: web
    name: tutortrack-api
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 app:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: TUTOR_ID
        value: tut_local
